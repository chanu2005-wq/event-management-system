# ══════════════════════════════════════════════════════════════════════════════
#  application.properties — Event Management System (Spring Boot 3.2)
#  Copy this file to application-dev.properties for local overrides.
# ══════════════════════════════════════════════════════════════════════════════

# ─── Application ──────────────────────────────────────────────────────────────
spring.application.name=event-management-backend
server.port=8080

# ─── H2 DataSource (dev) ──────────────────────────────────────────────────────
# In-memory so the app starts without PostgreSQL. Data is lost on restart.
# To switch to PostgreSQL later, replace this block with:
#   spring.datasource.url=jdbc:postgresql://localhost:5432/event_management
#   spring.datasource.username=postgres
#   spring.datasource.password=postgres
#   spring.datasource.driver-class-name=org.postgresql.Driver
#   spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.url=jdbc:h2:mem:event_management;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Connection pool (HikariCP defaults are good; adjust for production)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# ─── JPA / Hibernate ──────────────────────────────────────────────────────────
# update  → alter tables to match entities on startup (safe for dev)
# validate→ only validate — no schema changes (use for prod)
# create  → drop + recreate all tables on every startup (dev only, destroys data)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

# ─── CORS (Vite default + CRA default) ────────────────────────────────────────
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# ─── JWT ──────────────────────────────────────────────────────────────────────
# !! CHANGE this secret before deploying to production !!
# Must be at least 256 bits (32 chars) for HMAC-SHA256.
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
# Token validity: 24 hours in milliseconds
app.jwt.expiration-ms=86400000
# Token validity for refresh tokens: 7 days
app.jwt.refresh-expiration-ms=604800000

# ─── File Upload (local storage) ──────────────────────────────────────────────
# Max file size per upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
# Directory where uploaded images are stored (relative to working directory)
app.upload.dir=uploads

# ─── Swagger / SpringDoc OpenAPI ──────────────────────────────────────────────
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
# Allow Swagger UI to send JWT in Authorization header
springdoc.swagger-ui.tryItOutEnabled=true

# ─── Logging ──────────────────────────────────────────────────────────────────
logging.level.com.eventmanagement=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
